<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pokédex Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d12;--bg2:#13131a;--bg3:#1a1a24;--bg4:#22222f;--bg5:#2a2a3a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0eee8;--text2:#9896a0;--text3:#555465;
  --gold:#f0c040;--gold2:#c89820;--gold-bg:rgba(240,192,64,0.1);
  --green:#4caf7d;--green-bg:rgba(76,175,125,0.12);
  --blue:#60a5fa;--blue-bg:rgba(96,165,250,0.1);
  --purple:#c084fc;--purple-bg:rgba(192,132,252,0.1);
  --pink:#f472b6;--pink-bg:rgba(244,114,182,0.1);
  --orange:#fb923c;--orange-bg:rgba(251,146,60,0.1);
  --teal:#2dd4bf;--teal-bg:rgba(45,212,191,0.1);
  --red:#f87171;--red-bg:rgba(248,113,113,0.1);
  --display:'Bebas Neue',sans-serif;
  --body:'DM Sans',system-ui,sans-serif;
  --radius:10px;--radius-lg:16px;
}
html{font-size:15px}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;gap:1.25rem;position:sticky;top:0;z-index:50}
.logo{font-family:var(--display);font-size:1.8rem;letter-spacing:0.06em;background:linear-gradient(135deg,var(--gold),#fff8dc,var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
.progress-wrap{flex:1;display:flex;flex-direction:column;gap:4px}
.progress-bar-bg{background:var(--bg4);border-radius:20px;height:6px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:20px;transition:width 0.4s ease}
.progress-label{font-size:0.78rem;color:var(--text2)}
.progress-label strong{color:var(--gold);font-weight:500}
.api-status{display:flex;align-items:center;gap:6px;font-size:0.72rem;color:var(--text3);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0}
.dot.loading{background:var(--gold);animation:pulse 1s infinite}
.dot.done{background:var(--green)}
.dot.err{background:var(--red)}
.controls{background:var(--bg2);border-bottom:1px solid var(--border);padding:0.65rem 1.5rem;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:260px}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;width:13px;height:13px}
input[type=search]{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--body);font-size:0.82rem;padding:0.45rem 0.7rem 0.45rem 2.1rem;outline:none}
input[type=search]:focus{border-color:var(--border2)}
input[type=search]::placeholder{color:var(--text3)}
.filter-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);font-family:var(--body);font-size:0.78rem;padding:0.4rem 0.85rem;cursor:pointer;white-space:nowrap;transition:all 0.15s}
.filter-btn:hover{border-color:var(--border2);color:var(--text)}
.filter-btn.on{background:var(--gold-bg);border-color:var(--gold2);color:var(--gold)}
.filter-btn.on-green{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.filter-btn.on-blue{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);font-family:var(--body);font-size:0.78rem;padding:0.4rem 0.7rem;outline:none;cursor:pointer;-webkit-appearance:none}
select option{background:var(--bg3);color:var(--text)}
.view-toggle{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:2px;margin-left:auto}
.view-btn{background:none;border:none;border-radius:7px;padding:4px 8px;cursor:pointer;color:var(--text3);display:flex;align-items:center}
.view-btn.active{background:var(--bg5);color:var(--text)}
.view-btn svg{width:15px;height:15px}
.legend{background:var(--bg2);border-bottom:1px solid var(--border);padding:0.5rem 1.5rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.legend-label{font-size:0.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-right:4px}
.badge{font-size:0.67rem;padding:2px 6px;border-radius:4px;display:inline-block;font-weight:500;letter-spacing:0.04em;white-space:nowrap}
.b-sir{background:var(--purple-bg);color:var(--purple);border:1px solid rgba(192,132,252,0.3)}
.b-alt{background:var(--teal-bg);color:var(--teal);border:1px solid rgba(45,212,191,0.3)}
.b-hr{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(240,192,64,0.3)}
.b-rr{background:var(--pink-bg);color:var(--pink);border:1px solid rgba(244,114,182,0.3)}
.b-fa{background:var(--green-bg);color:var(--green);border:1px solid rgba(76,175,125,0.3)}
.b-ar{background:var(--orange-bg);color:var(--orange);border:1px solid rgba(251,146,60,0.3)}
.b-ir{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(96,165,250,0.3)}
.b-unk{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:5px;font-size:0.72rem;color:var(--text3)}
.main{padding:1.25rem 1.5rem 3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:9px}
.poke-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;cursor:pointer;transition:all 0.18s;position:relative;overflow:hidden}
.poke-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.poke-card.collected{border-color:rgba(76,175,125,0.4);background:linear-gradient(135deg,var(--bg2),rgba(76,175,125,0.04))}
.card-dex{font-size:0.68rem;color:var(--text3);font-family:var(--display);letter-spacing:0.08em;margin-bottom:3px}
.card-name{font-family:var(--display);font-size:1.1rem;letter-spacing:0.04em;color:var(--text);margin-bottom:5px;line-height:1.1}
.card-count{font-size:0.72rem;color:var(--text3);margin-bottom:6px}
.card-count span{color:var(--gold);font-weight:500}
.card-best{font-size:0.75rem;color:var(--text2);line-height:1.4}
.card-price{font-size:0.78rem;color:var(--text2);margin-top:4px}
.card-price span{color:var(--gold);font-weight:500}
.coll-badge{position:absolute;top:8px;right:8px;background:var(--green);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.coll-badge svg{width:10px;height:10px;color:#fff}
.no-cards{font-size:0.75rem;color:var(--text3);font-style:italic}
.gen-hdr{grid-column:1/-1;font-family:var(--display);font-size:0.95rem;letter-spacing:0.12em;color:var(--text3);padding:0.4rem 0 0.2rem;border-bottom:1px solid var(--border);margin-top:8px;margin-bottom:2px}
.list{display:flex;flex-direction:column;gap:3px}
.list-hdr{display:grid;grid-template-columns:48px 150px 1fr 140px 105px 70px;gap:10px;padding:0.35rem 1rem;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:3px}
.list-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:0.6rem 1rem;display:grid;grid-template-columns:48px 150px 1fr 140px 105px 70px;align-items:center;gap:10px;cursor:pointer;transition:all 0.15s;font-size:0.82rem}
.list-row:hover{border-color:var(--border2)}
.list-row.collected{border-color:rgba(76,175,125,0.35)}
.list-dex{font-family:var(--display);font-size:0.82rem;color:var(--text3);letter-spacing:0.06em}
.list-name{font-weight:500}
.list-card{color:var(--text2);font-size:0.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-price{text-align:right;color:var(--gold);font-weight:500}
.list-check{display:flex;justify-content:center}
.chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center}
.chk.done{background:var(--green);border-color:var(--green)}
.chk svg{width:11px;height:11px;color:#fff}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:100;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.backdrop.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:1.75rem;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;animation:mIn 0.2s ease both}
@keyframes mIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem;gap:1rem}
.modal-dex{font-size:0.72rem;color:var(--text3);font-family:var(--display);letter-spacing:0.08em}
.modal-name{font-family:var(--display);font-size:2rem;letter-spacing:0.04em;line-height:1}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:1.3rem;line-height:1;padding:4px;flex-shrink:0}
.modal-close:hover{color:var(--text)}
.mlabel{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--text3);margin-bottom:5px;display:block}
.era-group{margin-bottom:1rem}
.era-title{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:6px}
.card-opt{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:0.7rem 0.85rem;margin-bottom:5px;cursor:pointer;transition:all 0.15s}
.card-opt:hover{border-color:var(--border2)}
.card-opt.sel{border-color:var(--gold2);background:var(--gold-bg)}
.opt-name{font-size:0.85rem;font-weight:500;margin-bottom:3px}
.opt-meta{font-size:0.73rem;color:var(--text2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt-price{font-size:0.78rem;color:var(--gold);margin-top:3px;display:flex;align-items:center;gap:8px}
.notes-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--body);font-size:0.83rem;padding:0.55rem 0.75rem;outline:none;resize:vertical;min-height:56px}
.notes-input:focus{border-color:var(--border2)}
.modal-actions{display:flex;gap:8px;margin-top:1.25rem}
.btn-save{flex:1;padding:0.65rem;background:var(--green);color:#fff;font-family:var(--body);font-weight:500;font-size:0.85rem;border:none;border-radius:var(--radius);cursor:pointer}
.btn-save:hover{background:#5bbf8d}
.btn-remove{padding:0.65rem 0.9rem;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-family:var(--body);font-size:0.85rem;border-radius:var(--radius);cursor:pointer}
.btn-remove:hover{border-color:var(--red);color:var(--red)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:0.5rem;color:var(--text3);text-align:center}
.empty-icon{font-size:2.5rem;margin-bottom:0.5rem}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
@media(max-width:800px){
  .list-hdr,.list-row{grid-template-columns:42px 130px 1fr 100px 60px;gap:8px}
  .list-col-set{display:none}
}
@media(max-width:560px){
  .list-hdr,.list-row{grid-template-columns:38px 1fr 80px 50px;font-size:0.78rem;gap:6px}
  .list-col-rar{display:none}
  .header{padding:0.75rem 1rem}
  .controls,.legend{padding:0.5rem 1rem}
  .main{padding:1rem 0.75rem 4rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:7px}
}
</style>
</head>
<body>

<div class="backdrop" id="backdrop">
  <div class="modal">
    <div class="modal-top">
      <div>
        <div class="modal-dex" id="m-dex"></div>
        <div class="modal-name" id="m-name"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="m-body"></div>
  </div>
</div>

<header class="header">
  <div class="logo">Pokédex Binder</div>
  <div class="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
    <div class="progress-label"><strong id="prog-n">0</strong><span id="prog-t"> / 1025 collected</span></div>
  </div>
  <div class="api-status">
    <div class="dot loading" id="api-dot"></div>
    <span id="api-txt">Loading…</span>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="search" placeholder="Search Pokémon…" oninput="render()"/>
  </div>
  <button class="filter-btn on" id="fb-all" onclick="setF('all',this)">All</button>
  <button class="filter-btn" id="fb-col" onclick="setF('col',this)">Collected</button>
  <button class="filter-btn" id="fb-mis" onclick="setF('mis',this)">Missing</button>
  <select id="f-era" onchange="render()">
    <option value="">All Eras</option>
    <option value="Sun & Moon">Sun &amp; Moon</option>
    <option value="Sword & Shield">Sword &amp; Shield</option>
    <option value="Scarlet & Violet">Scarlet &amp; Violet</option>
  </select>
  <select id="f-rar" onchange="render()">
    <option value="">All Rarities</option>
    <option value="Special Illustration Rare">Special Illustration Rare</option>
    <option value="Alternate Art">Alternate Art</option>
    <option value="Hyper Rare">Hyper Rare</option>
    <option value="Rainbow Rare">Rainbow Rare</option>
    <option value="Full Art">Full Art</option>
    <option value="Amazing Rare">Amazing Rare</option>
    <option value="Illustration Rare">Illustration Rare</option>
  </select>
  <select id="f-gen" onchange="render()">
    <option value="">All Generations</option>
    <option value="1">Gen 1 (1–151)</option>
    <option value="2">Gen 2 (152–251)</option>
    <option value="3">Gen 3 (252–386)</option>
    <option value="4">Gen 4 (387–493)</option>
    <option value="5">Gen 5 (494–649)</option>
    <option value="6">Gen 6 (650–721)</option>
    <option value="7">Gen 7 (722–809)</option>
    <option value="8">Gen 8 (810–905)</option>
    <option value="9">Gen 9 (906–1025)</option>
  </select>
  <div class="view-toggle">
    <button class="view-btn active" id="vb-g" onclick="setView('grid')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <button class="view-btn" id="vb-l" onclick="setView('list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
  </div>
</div>

<div class="legend">
  <span class="legend-label">Rarities:</span>
  <div class="legend-item"><span class="badge b-sir">SIR</span> Special Illustration Rare</div>
  <div class="legend-item"><span class="badge b-alt">ALT</span> Alternate Art</div>
  <div class="legend-item"><span class="badge b-hr">HR</span> Hyper Rare (Gold)</div>
  <div class="legend-item"><span class="badge b-rr">RR</span> Rainbow Rare</div>
  <div class="legend-item"><span class="badge b-fa">FA</span> Full Art</div>
  <div class="legend-item"><span class="badge b-ar">AR</span> Amazing Rare</div>
  <div class="legend-item"><span class="badge b-ir">IR</span> Illustration Rare</div>
</div>

<main class="main" id="main"></main>

<script>
const API_BASE='https://api.pokemontcg.io/v2/cards';

// All target rarities including Alternate Art
const TARGET_RARITIES=[
  'Special Illustration Rare',
  'Hyper Rare',
  'Rainbow Rare',
  'Full Art',
  'Amazing Rare',
  'Illustration Rare'
];

// Alternate Art is a subset of Full Art in the API — we identify by name pattern
const VALID_SERIES=['Sun & Moon','Sword & Shield','Scarlet & Violet'];

const RARITY_PRIORITY={
  'Special Illustration Rare':0,
  'Alternate Art':1,
  'Hyper Rare':2,
  'Rainbow Rare':3,
  'Full Art':4,
  'Amazing Rare':5,
  'Illustration Rare':6
};

const GEN_RANGES=[[1,151],[152,251],[252,386],[387,493],[494,649],[650,721],[722,809],[810,905],[906,1025]];

// Identify Alternate Arts — these come back as "Full Art" from API but have "alt" in card number or specific naming patterns
function isAlternateArt(card){
  const num = parseInt(card.number);
  const total = card.set?.total || 999;
  // Alt arts are typically numbered above the set total in SS era, or have specific markers
  if(card.set?.series === 'Sword & Shield' && num > total) return true;
  // Some sets use TG prefix for trainer gallery which includes alt arts
  if(card.number && card.number.startsWith('TG')) return true;
  return false;
}

function getDisplayRarity(card){
  if(isAlternateArt(card)) return 'Alternate Art';
  return card.rarity;
}

function rarityBadge(r){
  const map={
    'Special Illustration Rare':['b-sir','SIR'],
    'Alternate Art':['b-alt','ALT'],
    'Hyper Rare':['b-hr','HR'],
    'Rainbow Rare':['b-rr','RR'],
    'Full Art':['b-fa','FA'],
    'Amazing Rare':['b-ar','AR'],
    'Illustration Rare':['b-ir','IR']
  };
  const[cls,lbl]=map[r]||['b-unk',r||'?'];
  return `<span class="badge ${cls}">${lbl}</span>`;
}

function bestCard(cards){
  if(!cards||!cards.length)return null;
  return[...cards].sort((a,b)=>{
    const ra=RARITY_PRIORITY[getDisplayRarity(a)]??99;
    const rb=RARITY_PRIORITY[getDisplayRarity(b)]??99;
    if(ra!==rb)return ra-rb;
    // within same rarity, newer era first
    const ea=ERA_ORDER[a.set?.series]??99;
    const eb=ERA_ORDER[b.set?.series]??99;
    return eb-ea;
  })[0];
}

function getCardPrice(card){
  if(!card?.tcgplayer?.prices)return null;
  const p=card.tcgplayer.prices;
  return p.holofoil?.market??p.reverseHolofoil?.market??p.normal?.market??p['1stEditionHolofoil']?.market??null;
}

function fmtPrice(p){return p!=null?'$'+parseFloat(p).toFixed(2):'—';}

// Group cards by era for modal display
function groupByEra(cards){
  const groups={};
  for(const card of cards){
    const era=card.set?.series||'Other';
    if(!groups[era])groups[era]=[];
    groups[era].push(card);
  }
  return groups;
}

async function loadAllCards(){
  setStatus('loading','Loading card data…');
  const cached=localStorage.getItem('pokedex_card_cache_v5');
  const age=localStorage.getItem('pokedex_card_cache_age_v5');
  if(cached&&age&&(Date.now()-parseInt(age))<86400000){
    try{cardDB=JSON.parse(cached);loadedCount=ALL_POKEMON.length;setStatus('done','Loaded from cache');render();return;}catch(e){}
  }
  const BATCH=8,DELAY=350;
  const batches=[];
  for(let i=0;i<ALL_POKEMON.length;i+=BATCH)batches.push(ALL_POKEMON.slice(i,i+BATCH));
  for(const batch of batches){
    await Promise.all(batch.map(([dex,name])=>fetchPokemon(dex,name)));
    loadedCount=Math.min(loadedCount+batch.length,ALL_POKEMON.length);
    setStatus('loading',`Loading… ${loadedCount}/${ALL_POKEMON.length}`);
    render();
    await new Promise(r=>setTimeout(r,DELAY));
  }
  try{
    localStorage.setItem('pokedex_card_cache_v5',JSON.stringify(cardDB));
    localStorage.setItem('pokedex_card_cache_age_v5',String(Date.now()));
  }catch(e){}
  setStatus('done','All cards loaded ✓');
  render();
}

async function fetchPokemon(dex,name){
  try{
    const rarQ=TARGET_RARITIES.map(r=>`rarity:"${r}"`).join(' OR ');
    const q=encodeURIComponent(`name:"${name}" (${rarQ})`);
    const r=await fetch(`${API_BASE}?q=${q}&select=id,name,set,number,rarity,tcgplayer&orderBy=-set.releaseDate&pageSize=100`);
    if(!r.ok){cardDB[dex]=[];return;}
    const d=await r.json();
    const cards=(d.data||[]).filter(c=>VALID_SERIES.includes(c.set?.series||''));
    cardDB[dex]=cards;
  }catch(e){cardDB[dex]=[];}
}

function setStatus(state,txt){
  document.getElementById('api-txt').textContent=txt;
  document.getElementById('api-dot').className='dot '+state;
}

function updateProgress(){
  const n=Object.keys(collection).length,t=ALL_POKEMON.length;
  document.getElementById('prog-bar').style.width=(n/t*100).toFixed(1)+'%';
  document.getElementById('prog-n').textContent=n;
  document.getElementById('prog-t').textContent=' / '+t+' collected';
}

function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const fE=document.getElementById('f-era').value;
  const fR=document.getElementById('f-rar').value;
  const fG=parseInt(document.getElementById('f-gen').value)||0;
  return ALL_POKEMON.filter(([dex,name])=>{
    if(q&&!name.toLowerCase().includes(q)&&!String(dex).includes(q))return false;
    const isCol=!!collection[dex];
    if(filterMode==='col'&&!isCol)return false;
    if(filterMode==='mis'&&isCol)return false;
    if(fG&&getGen(dex)!==fG)return false;
    const cards=cardDB[dex]||[];
    if(fE&&!cards.some(c=>c.set?.series===fE))return false;
    if(fR){
      if(fR==='Alternate Art'){
        if(!cards.some(c=>isAlternateArt(c)))return false;
      } else {
        if(!cards.some(c=>c.rarity===fR&&!isAlternateArt(c)))return false;
      }
    }
    return true;
  });
}

function render(){
  updateProgress();
  const items=getFiltered();
  const area=document.getElementById('main');
  if(!items.length){area.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div>No Pokémon match your filters</div></div>';return;}
  viewMode==='grid'?renderGrid(items,area):renderListView(items,area);
}

function renderGrid(items,area){
  let html='<div class="grid">';
  let lastGen=-1;
  for(const[dex,name]of items){
    const gen=getGen(dex);
    if(gen!==lastGen){html+=`<div class="gen-hdr">${GEN_NAMES[gen-1]}</div>`;lastGen=gen;}
    const cards=cardDB[dex];
    const isCol=!!collection[dex];
    const best=cards?bestCard(cards):null;
    const dispRar=best?getDisplayRarity(best):null;
    const price=best?getCardPrice(best):null;
    const isLoad=cards===undefined;
    let inner='';
    if(isLoad){
      inner=`<div class="card-count"><span class="spinner"></span></div>`;
    }else if(!cards||!cards.length){
      inner=`<div class="no-cards">No SM/SS/SV premium cards found</div>`;
    }else{
      inner=`<div class="card-count"><span>${cards.length}</span> card${cards.length!==1?'s':''} available</div>${best?rarityBadge(dispRar):''}<div class="card-best" style="margin-top:5px">${best?best.name:''}</div><div class="card-best" style="color:var(--text3)">${best?best.set.name+' · #'+best.number:''}</div><div class="card-price" style="margin-top:6px">TCG: <span>${fmtPrice(price)}</span></div>`;
    }
    html+=`<div class="poke-card${isCol?' collected':''}" onclick="openModal(${dex})">${isCol?`<div class="coll-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>`:''}<div class="card-dex">${dexStr(dex)}</div><div class="card-name">${name}</div>${inner}</div>`;
  }
  html+='</div>';
  area.innerHTML=html;
}

function renderListView(items,area){
  let html=`<div class="list-hdr"><span>#</span><span>Pokémon</span><span>Best Card</span><span class="list-col-rar">Rarity</span><span style="text-align:right">TCGPlayer</span><span style="text-align:center">Have</span></div><div class="list">`;
  for(const[dex,name]of items){
    const cards=cardDB[dex];
    const isCol=!!collection[dex];
    const best=cards?bestCard(cards):null;
    const dispRar=best?getDisplayRarity(best):null;
    const price=best?getCardPrice(best):null;
    const isLoad=cards===undefined;
    html+=`<div class="list-row${isCol?' collected':''}" onclick="openModal(${dex})"><span class="list-dex">${dexStr(dex)}</span><span class="list-name">${name}</span><span class="list-card">${isLoad?'Loading…':(best?best.name+' · '+best.set.name:'No cards found')}</span><span class="list-col-rar">${best?rarityBadge(dispRar):''}</span><span class="list-price">${fmtPrice(price)}</span><span class="list-check"><div class="chk${isCol?' done':''}">${isCol?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`:''}</div></span></div>`;
  }
  html+='</div>';
  area.innerHTML=html;
}

function openModal(dex){
  currentDex=dex;
  const name=ALL_POKEMON.find(p=>p[0]===dex)?.[1]||'';
  const col=collection[dex];
  selCardId=col?.cardId||null;
  document.getElementById('m-dex').textContent=dexStr(dex);
  document.getElementById('m-name').textContent=name;
  const cards=cardDB[dex];
  let body='';
  if(!cards||!cards.length){
    body=`<div style="color:var(--text3);font-size:0.85rem;margin-bottom:1rem">No Sun & Moon, Sword & Shield, or Scarlet & Violet premium cards found for ${name}.<br><br>This Pokémon may only have cards in earlier eras, or may not have a premium art version yet.</div>`;
  }else{
    if(!selCardId)selCardId=bestCard(cards)?.id||null;
    // Group by era
    const groups=groupByEra(cards);
    const eraOrder=['Scarlet & Violet','Sword & Shield','Sun & Moon'];
    body=`<span class="mlabel" style="margin-bottom:8px">Select card for your binder (${cards.length} total across all eras)</span>`;
    for(const era of eraOrder){
      if(!groups[era]||!groups[era].length)continue;
      const eraCards=groups[era].sort((a,b)=>(RARITY_PRIORITY[getDisplayRarity(a)]??99)-(RARITY_PRIORITY[getDisplayRarity(b)]??99));
      body+=`<div class="era-group"><div class="era-title">${era}</div>`;
      for(const card of eraCards){
        const p=getCardPrice(card);
        const dispRar=getDisplayRarity(card);
        const sel=card.id===selCardId;
        const tcgUrl=card.tcgplayer?.url||`https://www.tcgplayer.com/search/pokemon/product?q=${encodeURIComponent(card.name)}`;
        body+=`<div class="card-opt${sel?' sel':''}" onclick="selCard('${card.id}')"><div class="opt-name">${card.name}</div><div class="opt-meta">${rarityBadge(dispRar)}<span>${card.set.name}</span><span>#${card.number}</span></div><div class="opt-price">TCGPlayer: ${fmtPrice(p)}<a href="${tcgUrl}" target="_blank" style="color:var(--text3);font-size:0.7rem;margin-left:8px;text-decoration:none" onclick="event.stopPropagation()">View ↗</a></div></div>`;
      }
      body+='</div>';
    }
  }
  body+=`<div style="margin-top:1rem;margin-bottom:0.5rem"><span class="mlabel">Notes</span></div><textarea class="notes-input" id="m-notes" placeholder="Condition, price paid, where bought, which version…">${col?.notes||''}</textarea><div class="modal-actions"><button class="btn-save" onclick="saveEntry()">Mark as Collected</button>${col?`<button class="btn-remove" onclick="removeEntry()">Remove</button>`:''}</div>`;
  document.getElementById('m-body').innerHTML=body;
  document.getElementById('backdrop').classList.add('open');
}

function selCard(id){
  selCardId=id;
  document.querySelectorAll('.card-opt').forEach(el=>{
    el.classList.toggle('sel',(el.getAttribute('onclick')||'').includes(`'${id}'`));
  });
}

function closeModal(){document.getElementById('backdrop').classList.remove('open');currentDex=null;selCardId=null;}
function saveEntry(){if(!currentDex)return;const notes=document.getElementById('m-notes')?.value.trim()||'';collection[currentDex]={cardId:selCardId,notes};saveCollection();closeModal();render();}
function removeEntry(){if(!currentDex)return;delete collection[currentDex];saveCollection();closeModal();render();}

function setF(mode,btn){
  filterMode=mode;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('on','on-green','on-blue'));
  if(mode==='all')btn.classList.add('on');
  if(mode==='col')btn.classList.add('on-green');
  if(mode==='mis')btn.classList.add('on-blue');
  render();
}

function setView(v){
  viewMode=v;
  document.getElementById('vb-g').classList.toggle('active',v==='grid');
  document.getElementById('vb-l').classList.toggle('active',v==='list');
  render();
}

document.getElementById('backdrop').addEventListener('click',e=>{if(e.target===document.getElementById('backdrop'))closeModal();});

loadCollection();
render();
loadAllCards();
</script>
</body>
</html>
