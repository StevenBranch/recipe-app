<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pokédex Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d12;--bg2:#13131a;--bg3:#1a1a24;--bg4:#22222f;--bg5:#2a2a3a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0eee8;--text2:#9896a0;--text3:#555465;
  --gold:#f0c040;--gold2:#c89820;--gold-bg:rgba(240,192,64,0.1);
  --green:#4caf7d;--green-bg:rgba(76,175,125,0.12);
  --blue:#60a5fa;--blue-bg:rgba(96,165,250,0.1);
  --purple:#c084fc;--purple-bg:rgba(192,132,252,0.1);
  --pink:#f472b6;--pink-bg:rgba(244,114,182,0.1);
  --orange:#fb923c;--orange-bg:rgba(251,146,60,0.1);
  --teal:#2dd4bf;--teal-bg:rgba(45,212,191,0.1);
  --red:#f87171;--red-bg:rgba(248,113,113,0.1);
  --display:'Bebas Neue',sans-serif;
  --body:'DM Sans',system-ui,sans-serif;
  --radius:10px;--radius-lg:16px;
}
html{font-size:15px}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;gap:1.25rem;position:sticky;top:0;z-index:50}
.logo{font-family:var(--display);font-size:1.8rem;letter-spacing:0.06em;background:linear-gradient(135deg,var(--gold),#fff8dc,var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
.progress-wrap{flex:1;display:flex;flex-direction:column;gap:4px}
.progress-bar-bg{background:var(--bg4);border-radius:20px;height:6px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:20px;transition:width 0.4s ease}
.progress-label{font-size:0.78rem;color:var(--text2)}
.progress-label strong{color:var(--gold);font-weight:500}
.api-status{display:flex;align-items:center;gap:6px;font-size:0.72rem;color:var(--text3);margin-left:auto;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0}
.dot.loading{background:var(--gold);animation:pulse 1s infinite}
.dot.done{background:var(--green)}
.dot.err{background:var(--red)}
.controls{background:var(--bg2);border-bottom:1px solid var(--border);padding:0.65rem 1.5rem;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:280px}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;width:13px;height:13px}
input[type=search]{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--body);font-size:0.82rem;padding:0.45rem 0.7rem 0.45rem 2.1rem;outline:none}
input[type=search]:focus{border-color:var(--border2)}
input[type=search]::placeholder{color:var(--text3)}
.filter-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);font-family:var(--body);font-size:0.78rem;padding:0.4rem 0.85rem;cursor:pointer;white-space:nowrap;transition:all 0.15s}
.filter-btn:hover{border-color:var(--border2);color:var(--text)}
.filter-btn.on{background:var(--gold-bg);border-color:var(--gold2);color:var(--gold)}
.filter-btn.on-green{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.filter-btn.on-blue{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);font-family:var(--body);font-size:0.78rem;padding:0.4rem 0.7rem;outline:none;cursor:pointer;-webkit-appearance:none}
select option{background:var(--bg3);color:var(--text)}
.view-toggle{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:2px;margin-left:auto}
.view-btn{background:none;border:none;border-radius:7px;padding:4px 8px;cursor:pointer;color:var(--text3);display:flex;align-items:center}
.view-btn.active{background:var(--bg5);color:var(--text)}
.view-btn svg{width:15px;height:15px}
/* RARITY BADGES */
.badge{font-size:0.67rem;padding:2px 6px;border-radius:4px;display:inline-block;font-weight:500;letter-spacing:0.04em;white-space:nowrap}
.b-sir{background:var(--purple-bg);color:var(--purple);border:1px solid rgba(192,132,252,0.3)}
.b-alt{background:rgba(45,212,191,0.1);color:var(--teal);border:1px solid rgba(45,212,191,0.3)}
.b-hr{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(240,192,64,0.3)}
.b-rr{background:var(--pink-bg);color:var(--pink);border:1px solid rgba(244,114,182,0.3)}
.b-fa{background:var(--green-bg);color:var(--green);border:1px solid rgba(76,175,125,0.3)}
.b-ar{background:var(--orange-bg);color:var(--orange);border:1px solid rgba(251,146,60,0.3)}
.b-ir{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(96,165,250,0.3)}
.b-unk{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
/* ERA BADGES */
.era-badge{font-size:0.62rem;padding:1px 5px;border-radius:3px;font-weight:500;letter-spacing:0.04em;white-space:nowrap}
.era-sm{background:rgba(251,146,60,0.12);color:#fb923c;border:1px solid rgba(251,146,60,0.25)}
.era-ss{background:rgba(96,165,250,0.12);color:#60a5fa;border:1px solid rgba(96,165,250,0.25)}
.era-sv{background:rgba(192,132,252,0.12);color:#c084fc;border:1px solid rgba(192,132,252,0.25)}
.main{padding:1.25rem 1.5rem 3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:9px}
.poke-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;cursor:pointer;transition:all 0.18s;position:relative;overflow:hidden}
.poke-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.poke-card.collected{border-color:rgba(76,175,125,0.4);background:linear-gradient(135deg,var(--bg2),rgba(76,175,125,0.04))}
.card-dex{font-size:0.68rem;color:var(--text3);font-family:var(--display);letter-spacing:0.08em;margin-bottom:3px}
.card-name{font-family:var(--display);font-size:1.1rem;letter-spacing:0.04em;color:var(--text);margin-bottom:5px;line-height:1.1}
.card-count{font-size:0.72rem;color:var(--text3);margin-bottom:6px}
.card-count span{color:var(--gold);font-weight:500}
.card-best{font-size:0.75rem;color:var(--text2);line-height:1.4}
.card-price{font-size:0.78rem;color:var(--text2);margin-top:4px}
.card-price span{color:var(--gold);font-weight:500}
.coll-badge{position:absolute;top:8px;right:8px;background:var(--green);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.coll-badge svg{width:10px;height:10px;color:#fff}
.no-cards{font-size:0.75rem;color:var(--text3);font-style:italic}
.gen-hdr{grid-column:1/-1;font-family:var(--display);font-size:0.95rem;letter-spacing:0.12em;color:var(--text3);padding:0.4rem 0 0.2rem;border-bottom:1px solid var(--border);margin-top:8px;margin-bottom:2px}
.list{display:flex;flex-direction:column;gap:3px}
.list-hdr{display:grid;grid-template-columns:48px 150px 1fr 130px 105px 70px;gap:10px;padding:0.35rem 1rem;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:3px}
.list-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:0.6rem 1rem;display:grid;grid-template-columns:48px 150px 1fr 130px 105px 70px;align-items:center;gap:10px;cursor:pointer;transition:all 0.15s;font-size:0.82rem}
.list-row:hover{border-color:var(--border2)}
.list-row.collected{border-color:rgba(76,175,125,0.35)}
.list-dex{font-family:var(--display);font-size:0.82rem;color:var(--text3);letter-spacing:0.06em}
.list-name{font-weight:500}
.list-card{color:var(--text2);font-size:0.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-price{text-align:right;color:var(--gold);font-weight:500}
.list-check{display:flex;justify-content:center}
.chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center}
.chk.done{background:var(--green);border-color:var(--green)}
.chk svg{width:11px;height:11px;color:#fff}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:100;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.backdrop.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:1.75rem;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;animation:mIn 0.2s ease both}
@keyframes mIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem;gap:1rem}
.modal-dex{font-size:0.72rem;color:var(--text3);font-family:var(--display);letter-spacing:0.08em}
.modal-name{font-family:var(--display);font-size:2rem;letter-spacing:0.04em;line-height:1}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:1.3rem;line-height:1;padding:4px;flex-shrink:0}
.modal-close:hover{color:var(--text)}
.mlabel{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--text3);margin-bottom:5px;display:block}
.card-opt{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:0.7rem 0.85rem;margin-bottom:5px;cursor:pointer;transition:all 0.15s}
.card-opt:hover{border-color:var(--border2)}
.card-opt.sel{border-color:var(--gold2);background:var(--gold-bg)}
.opt-name{font-size:0.85rem;font-weight:500;margin-bottom:3px}
.opt-meta{font-size:0.73rem;color:var(--text2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt-price{font-size:0.78rem;color:var(--gold);margin-top:3px}
.notes-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--body);font-size:0.83rem;padding:0.55rem 0.75rem;outline:none;resize:vertical;min-height:56px}
.notes-input:focus{border-color:var(--border2)}
.modal-actions{display:flex;gap:8px;margin-top:1.25rem}
.btn-save{flex:1;padding:0.65rem;background:var(--green);color:#fff;font-family:var(--body);font-weight:500;font-size:0.85rem;border:none;border-radius:var(--radius);cursor:pointer}
.btn-save:hover{background:#5bbf8d}
.btn-remove{padding:0.65rem 0.9rem;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-family:var(--body);font-size:0.85rem;border-radius:var(--radius);cursor:pointer}
.btn-remove:hover{border-color:var(--red);color:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:0.6rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border);font-size:0.72rem;color:var(--text3)}
.legend-item{display:flex;align-items:center;gap:4px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:0.5rem;color:var(--text3);text-align:center}
.empty-icon{font-size:2.5rem;margin-bottom:0.5rem}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
@media(max-width:800px){.list-hdr,.list-row{grid-template-columns:42px 130px 1fr 90px 60px;gap:8px}.list-col-set{display:none}}
@media(max-width:560px){.list-hdr,.list-row{grid-template-columns:38px 1fr 80px 50px;font-size:0.78rem;gap:6px}.list-col-rar{display:none}.header{padding:0.75rem 1rem}.controls{padding:0.5rem 1rem}.main{padding:1rem 0.75rem 4rem}.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:7px}.legend{padding:0.5rem 1rem}}
</style>
</head>
<body>

<div class="backdrop" id="backdrop">
  <div class="modal">
    <div class="modal-top">
      <div>
        <div class="modal-dex" id="m-dex"></div>
        <div class="modal-name" id="m-name"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="m-body"></div>
  </div>
</div>

<header class="header">
  <div class="logo">Pokédex Binder</div>
  <div class="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
    <div class="progress-label"><strong id="prog-n">0</strong><span id="prog-t"> / 1025 collected</span></div>
  </div>
  <div class="api-status">
    <div class="dot loading" id="api-dot"></div>
    <span id="api-txt">Loading…</span>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="search" placeholder="Search Pokémon…" oninput="render()"/>
  </div>
  <button class="filter-btn on" id="fb-all" onclick="setF('all',this)">All</button>
  <button class="filter-btn" id="fb-col" onclick="setF('col',this)">Collected</button>
  <button class="filter-btn" id="fb-mis" onclick="setF('mis',this)">Missing</button>
  <select id="f-rar" onchange="render()">
    <option value="">All Rarities</option>
    <option value="Special Illustration Rare">Special Illustration Rare (SIR)</option>
    <option value="Illustration Rare">Illustration Rare (IR)</option>
    <option value="Hyper Rare">Hyper Rare (Gold)</option>
    <option value="ACE SPEC Rare">ACE SPEC Rare</option>
    <option value="Alternate Art">Alternate Art</option>
    <option value="Rainbow Rare">Rainbow Rare</option>
    <option value="Full Art">Full Art</option>
    <option value="Amazing Rare">Amazing Rare</option>
  </select>
  <select id="f-era" onchange="render()">
    <option value="">All Eras</option>
    <option value="Sun & Moon">Sun & Moon (2017–2019)</option>
    <option value="Sword & Shield">Sword & Shield (2020–2022)</option>
    <option value="Scarlet & Violet">Scarlet & Violet (2023–)</option>
  </select>
  <select id="f-gen" onchange="render()">
    <option value="">All Generations</option>
    <option value="1">Gen 1 (1–151)</option>
    <option value="2">Gen 2 (152–251)</option>
    <option value="3">Gen 3 (252–386)</option>
    <option value="4">Gen 4 (387–493)</option>
    <option value="5">Gen 5 (494–649)</option>
    <option value="6">Gen 6 (650–721)</option>
    <option value="7">Gen 7 (722–809)</option>
    <option value="8">Gen 8 (810–905)</option>
    <option value="9">Gen 9 (906–1025)</option>
  </select>
  <div class="view-toggle">
    <button class="view-btn active" id="vb-g" onclick="setView('grid')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <button class="view-btn" id="vb-l" onclick="setView('list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
  </div>
</div>

<!-- RARITY LEGEND -->
<div class="legend">
  <span style="color:var(--text3);margin-right:4px">Rarities:</span>
  <span class="legend-item"><span class="badge b-sir">SIR</span> Special Illustration Rare</span>
  <span class="legend-item"><span class="badge b-alt">ALT</span> Alternate Art</span>
  <span class="legend-item"><span class="badge b-hr">HR</span> Hyper Rare (Gold)</span>
  <span class="legend-item"><span class="badge b-rr">RR</span> Rainbow Rare</span>
  <span class="legend-item"><span class="badge b-fa">FA</span> Full Art</span>
  <span class="legend-item"><span class="badge b-ar">AR</span> Amazing Rare</span>
  <span class="legend-item"><span class="badge b-ir">IR</span> Illustration Rare</span>
</div>

<main class="main" id="main"></main>

<script>
const API_BASE='https://api.pokemontcg.io/v2/cards';

// All target rarities including SM era GX Full Arts
const TARGET_RARITIES=[
  'Special Illustration Rare',
  'Illustration Rare',
  'Hyper Rare',
  'ACE SPEC Rare',
  'Alternate Art',
  'Rainbow Rare',
  'Full Art',
  'Amazing Rare',
];

// Era filter mapping to API set series
const VALID_SERIES=['Sun & Moon','Sword & Shield','Scarlet & Violet'];

// Priority: best card shown first
const RARITY_PRIORITY={
  'Special Illustration Rare':0,
  'Alternate Art':1,
  'Hyper Rare':2,
  'Rainbow Rare':3,
  'Full Art':4,
  'ACE SPEC Rare':5,
  'Amazing Rare':6,
  'Illustration Rare':7,
};

const GEN_RANGES=[[1,151],[152,251],[252,386],[387,493],[494,649],[650,721],[722,809],[810,905],[906,1025]];
