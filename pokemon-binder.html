<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pokédex Binder</title>
<meta name="theme-color" content="#0d0d12"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PokéBinder"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d12;--bg2:#13131a;--bg3:#1a1a24;--bg4:#22222f;--bg5:#2a2a3a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0eee8;--text2:#9896a0;--text3:#555465;
  --gold:#f0c040;--gold2:#c89820;--gold-bg:rgba(240,192,64,0.1);
  --green:#4caf7d;--green-bg:rgba(76,175,125,0.12);
  --blue:#60a5fa;--blue-bg:rgba(96,165,250,0.1);
  --purple:#c084fc;--purple-bg:rgba(192,132,252,0.1);
  --pink:#f472b6;--pink-bg:rgba(244,114,182,0.1);
  --orange:#fb923c;--orange-bg:rgba(251,146,60,0.1);
  --teal:#2dd4bf;--teal-bg:rgba(45,212,191,0.1);
  --red:#f87171;--red-bg:rgba(248,113,113,0.1);
  --yellow:#fbbf24;--yellow-bg:rgba(251,191,36,0.1);
  --display:'Bebas Neue',sans-serif;
  --body:'DM Sans',system-ui,sans-serif;
  --radius:10px;--radius-lg:16px;
}
html{font-size:15px}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0.85rem 1.5rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:1.7rem;letter-spacing:0.06em;background:linear-gradient(135deg,var(--gold),#fff8dc,var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
.header-mid{flex:1;display:flex;flex-direction:column;gap:3px;min-width:160px}
.progress-bar-bg{background:var(--bg4);border-radius:20px;height:5px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:20px;transition:width 0.4s ease}
.progress-label{font-size:0.75rem;color:var(--text2)}
.progress-label strong{color:var(--gold);font-weight:500}
.header-stats{display:flex;gap:6px;flex-wrap:wrap}
.stat-pill{border-radius:var(--radius);padding:4px 10px;font-size:0.75rem;white-space:nowrap}
.stat-pill.green{background:var(--green-bg);border:1px solid rgba(76,175,125,0.3);color:var(--green)}
.stat-pill.yellow{background:var(--yellow-bg);border:1px solid rgba(251,191,36,0.3);color:var(--yellow)}
.stat-pill strong{font-weight:500}
.api-status{display:flex;align-items:center;gap:5px;font-size:0.72rem;color:var(--text3);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0}
.dot.loading{background:var(--gold);animation:pulse 1s infinite}
.dot.done{background:var(--green)}
.dot.err{background:var(--red)}
.controls{background:var(--bg2);border-bottom:1px solid var(--border);padding:0.6rem 1.5rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.search-wrap{position:relative;flex:1;min-width:160px;max-width:250px}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;width:13px;height:13px}
input[type=search],input[type=text],input[type=number]{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--body);font-size:0.82rem;padding:0.45rem 0.7rem;outline:none}
input[type=search]{width:100%;padding-left:2.1rem}
input:focus{border-color:var(--border2)}
input::placeholder{color:var(--text3)}
.filter-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);font-family:var(--body);font-size:0.78rem;padding:0.38rem 0.8rem;cursor:pointer;white-space:nowrap;transition:all 0.15s}
.filter-btn:hover{border-color:var(--border2);color:var(--text)}
.filter-btn.on{background:var(--gold-bg);border-color:var(--gold2);color:var(--gold)}
.filter-btn.on-green{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.filter-btn.on-blue{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.filter-btn.on-yellow{background:var(--yellow-bg);border-color:var(--yellow);color:var(--yellow)}
select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);font-family:var(--body);font-size:0.78rem;padding:0.38rem 0.7rem;outline:none;cursor:pointer;-webkit-appearance:none}
select option{background:var(--bg3);color:var(--text)}
.view-toggle{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:2px;margin-left:auto}
.view-btn{background:none;border:none;border-radius:7px;padding:4px 8px;cursor:pointer;color:var(--text3);display:flex;align-items:center}
.view-btn.active{background:var(--bg5);color:var(--text)}
.view-btn svg{width:15px;height:15px}
.legend{background:var(--bg2);border-bottom:1px solid var(--border);padding:0.45rem 1.5rem;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.legend-label{font-size:0.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-right:3px}
.badge{font-size:0.65rem;padding:2px 5px;border-radius:4px;display:inline-block;font-weight:500;letter-spacing:0.04em;white-space:nowrap}
.b-sir{background:var(--purple-bg);color:var(--purple);border:1px solid rgba(192,132,252,0.3)}
.b-alt{background:var(--teal-bg);color:var(--teal);border:1px solid rgba(45,212,191,0.3)}
.b-hr{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(240,192,64,0.3)}
.b-rr{background:var(--pink-bg);color:var(--pink);border:1px solid rgba(244,114,182,0.3)}
.b-sr{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,0.3)}
.b-fa{background:var(--green-bg);color:var(--green);border:1px solid rgba(76,175,125,0.3)}
.b-ar{background:var(--orange-bg);color:var(--orange);border:1px solid rgba(251,146,60,0.3)}
.b-ir{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(96,165,250,0.3)}
.b-manual{background:rgba(255,255,255,0.05);color:var(--text3);border:1px solid var(--border)}
.b-unk{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:4px;font-size:0.7rem;color:var(--text3)}
.main{padding:1.1rem 1.5rem 3rem}
/* WANT LIST */
.want-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.want-title{font-family:var(--display);font-size:1.4rem;letter-spacing:0.06em;color:var(--yellow)}
.want-total{font-size:0.82rem;color:var(--text2)}
.want-total strong{color:var(--yellow);font-weight:500}
.want-sort{display:flex;gap:5px;align-items:center}
.want-sort label{font-size:0.72rem;color:var(--text3)}
.want-list{display:flex;flex-direction:column;gap:6px}
.want-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:0.9rem 1rem;display:grid;grid-template-columns:46px 160px 1fr auto;align-items:center;gap:12px;transition:all 0.15s}
.want-item:hover{border-color:var(--border2)}
.want-dex{font-family:var(--display);font-size:0.82rem;color:var(--text3);letter-spacing:0.06em}
.want-name{font-family:var(--display);font-size:1rem;letter-spacing:0.04em}
.want-card-info{display:flex;flex-direction:column;gap:2px}
.want-card-name{font-size:0.82rem;font-weight:500;color:var(--text)}
.want-card-meta{font-size:0.72rem;color:var(--text3)}
.want-actions{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.want-price{font-size:1rem;font-weight:500;color:var(--yellow);text-align:right}
.want-price.no-price{color:var(--text3);font-size:0.78rem}
.want-btns{display:flex;gap:5px}
.buy-btn{display:inline-flex;align-items:center;gap:4px;background:rgba(76,175,125,0.12);border:1px solid rgba(76,175,125,0.3);border-radius:5px;padding:3px 8px;font-size:0.68rem;color:var(--green);text-decoration:none;white-space:nowrap;transition:all 0.15s}
.buy-btn:hover{background:rgba(76,175,125,0.22)}
.ebay-btn{display:inline-flex;align-items:center;gap:4px;background:var(--blue-bg);border:1px solid rgba(96,165,250,0.3);border-radius:5px;padding:3px 8px;font-size:0.68rem;color:var(--blue);text-decoration:none;white-space:nowrap;cursor:pointer;transition:all 0.15s}
.ebay-btn:hover{background:rgba(96,165,250,0.18)}
.remove-want-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:3px 7px;font-size:0.68rem;color:var(--text3);cursor:pointer;transition:all 0.15s}
.remove-want-btn:hover{border-color:var(--red);color:var(--red)}
@media(max-width:600px){.want-item{grid-template-columns:38px 1fr auto;gap:8px}.want-dex{display:none}}
/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:8px}
.poke-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:0.9rem;cursor:pointer;transition:all 0.18s;position:relative;overflow:hidden}
.poke-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.poke-card.collected{border-color:rgba(76,175,125,0.4);background:linear-gradient(135deg,var(--bg2),rgba(76,175,125,0.04))}
.poke-card.wanted{border-color:rgba(251,191,36,0.4);background:linear-gradient(135deg,var(--bg2),rgba(251,191,36,0.04))}
.card-dex{font-size:0.67rem;color:var(--text3);font-family:var(--display);letter-spacing:0.08em;margin-bottom:2px}
.card-name{font-family:var(--display);font-size:1.05rem;letter-spacing:0.04em;color:var(--text);margin-bottom:4px;line-height:1.1}
.card-count{font-size:0.7rem;color:var(--text3);margin-bottom:5px}
.card-count span{color:var(--gold);font-weight:500}
.card-best{font-size:0.73rem;color:var(--text2);line-height:1.4}
.card-price{font-size:0.75rem;color:var(--text2);margin-top:3px}
.card-price span{color:var(--gold);font-weight:500}
.status-badge{position:absolute;top:7px;right:7px;border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center}
.status-badge.collected{background:var(--green)}
.status-badge.wanted{background:var(--yellow)}
.status-badge svg{width:9px;height:9px;color:#fff}
.status-badge span{font-size:9px;line-height:1}
.no-cards{font-size:0.73rem;color:var(--text3);font-style:italic}
.gen-hdr{grid-column:1/-1;font-family:var(--display);font-size:0.92rem;letter-spacing:0.12em;color:var(--text3);padding:0.35rem 0 0.15rem;border-bottom:1px solid var(--border);margin-top:6px;margin-bottom:1px}
/* LIST */
.list{display:flex;flex-direction:column;gap:3px}
.list-hdr{display:grid;grid-template-columns:46px 145px 1fr 130px 100px 65px;gap:9px;padding:0.3rem 1rem;font-size:0.67rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:2px}
.list-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:0.55rem 1rem;display:grid;grid-template-columns:46px 145px 1fr 130px 100px 65px;align-items:center;gap:9px;cursor:pointer;transition:all 0.15s;font-size:0.8rem}
.list-row:hover{border-color:var(--border2)}
.list-row.collected{border-color:rgba(76,175,125,0.35)}
.list-row.wanted{border-color:rgba(251,191,36,0.35)}
.list-dex{font-family:var(--display);font-size:0.8rem;color:var(--text3);letter-spacing:0.06em}
.list-name{font-weight:500}
.list-card{color:var(--text2);font-size:0.73rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-price{text-align:right;color:var(--gold);font-weight:500}
.list-check{display:flex;justify-content:center}
.chk{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center}
.chk.done{background:var(--green);border-color:var(--green)}
.chk.want{background:var(--yellow);border-color:var(--yellow)}
.chk svg{width:10px;height:10px;color:#fff}
.chk span{font-size:9px;line-height:1}
/* MODAL */
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.backdrop.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:mIn 0.2s ease both}
@keyframes mIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
.modal-header{padding:1.4rem 1.4rem 0.8rem;flex-shrink:0}
.modal-scroll{flex:1;overflow-y:auto;padding:0 1.4rem 0.5rem}
.modal-search{position:relative;margin-bottom:0.8rem}
.modal-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;width:13px;height:13px}
.modal-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--body);font-size:0.82rem;padding:0.45rem 0.7rem 0.45rem 2.1rem;outline:none;box-sizing:border-box}
.modal-search input:focus{border-color:var(--border2)}
.modal-sticky{flex-shrink:0;padding:0.75rem 1.4rem;background:var(--bg2);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sticky-selected{font-size:0.75rem;color:var(--text2);min-height:16px;text-align:center}
.sticky-selected strong{color:var(--text);font-weight:500}
.sticky-btns{display:flex;gap:7px}
.sticky-btns .btn-save{flex:1;padding:0.65rem;font-size:0.83rem}
.no-results{font-size:0.78rem;color:var(--text3);text-align:center;padding:1rem 0;font-style:italic}

.modal-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.1rem;gap:1rem}
.modal-dex{font-size:0.7rem;color:var(--text3);font-family:var(--display);letter-spacing:0.08em}
.modal-name{font-family:var(--display);font-size:1.9rem;letter-spacing:0.04em;line-height:1}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:1.3rem;line-height:1;padding:4px;flex-shrink:0}
.modal-close:hover{color:var(--text)}
.mlabel{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--text3);margin-bottom:4px;display:block}
.modal-action-row{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.btn-want{flex:1;padding:0.6rem;background:var(--yellow-bg);color:var(--yellow);border:1px solid rgba(251,191,36,0.3);font-family:var(--body);font-weight:500;font-size:0.82rem;border-radius:var(--radius);cursor:pointer;min-width:120px}
.btn-want:hover{background:rgba(251,191,36,0.18)}
.btn-want.active{background:rgba(251,191,36,0.25);border-color:var(--yellow)}
.era-group{margin-bottom:0.9rem}
.era-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);padding:3px 0;border-bottom:1px solid var(--border);margin-bottom:5px}
.card-opt{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:0.65rem 0.8rem;margin-bottom:4px;cursor:pointer;transition:all 0.15s}
.card-opt:hover{border-color:var(--border2)}
.card-opt.sel{border-color:var(--gold2);background:var(--gold-bg)}
.opt-name{font-size:0.83rem;font-weight:500;margin-bottom:3px}
.opt-meta{font-size:0.71rem;color:var(--text2);display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:5px}
.price-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px}
.price-source{background:var(--bg4);border-radius:6px;padding:5px 8px;text-align:center}
.price-source-label{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:2px}
.price-source-val{font-size:0.82rem;font-weight:500;color:var(--gold)}
.price-source-val.loading{color:var(--text3);font-size:0.7rem}
.price-source-val.na{color:var(--text3)}
.manual-section{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:0.9rem;margin-bottom:0.9rem}
.manual-section-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--teal);margin-bottom:8px}
.manual-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.manual-grid .full{grid-column:1/-1}
.manual-grid label{display:block;font-size:0.67rem;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.06em}
.manual-grid input,.manual-grid select{width:100%;font-size:0.8rem}
.notes-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--body);font-size:0.82rem;padding:0.5rem 0.7rem;outline:none;resize:vertical;min-height:52px}
.notes-input:focus{border-color:var(--border2)}
.price-input-wrap{display:flex;align-items:center;gap:6px;margin-top:6px}
.price-input-wrap label{font-size:0.72rem;color:var(--text3);white-space:nowrap}
.modal-actions{display:flex;gap:7px;margin-top:1.1rem}
.btn-save{flex:1;padding:0.62rem;background:var(--green);color:#fff;font-family:var(--body);font-weight:500;font-size:0.83rem;border:none;border-radius:var(--radius);cursor:pointer}
.btn-save:hover{background:#5bbf8d}
.btn-remove{padding:0.62rem 0.85rem;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-family:var(--body);font-size:0.83rem;border-radius:var(--radius);cursor:pointer}
.btn-remove:hover{border-color:var(--red);color:var(--red)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:0.5rem;color:var(--text3);text-align:center}
.empty-icon{font-size:2.5rem;margin-bottom:0.5rem}
.spinner{display:inline-block;width:11px;height:11px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.7s linear infinite}
.spinner-sm{display:inline-block;width:8px;height:8px;border:1.5px solid var(--border2);border-top-color:var(--text3);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
@media(max-width:800px){.list-hdr,.list-row{grid-template-columns:40px 125px 1fr 90px 55px;gap:7px}.list-col-set{display:none}}
@media(max-width:560px){.list-hdr,.list-row{grid-template-columns:36px 1fr 75px 48px;font-size:0.76rem;gap:5px}.list-col-rar{display:none}.header{padding:0.7rem 1rem}.controls,.legend{padding:0.45rem 1rem}.main{padding:0.9rem 0.75rem 4rem}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.price-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="backdrop" id="backdrop">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-top" style="margin-bottom:0">
        <div><div class="modal-dex" id="m-dex"></div><div class="modal-name" id="m-name"></div></div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="modal-scroll" id="m-body"></div>
    <div class="modal-sticky" id="m-sticky">
      <div class="sticky-selected" id="sticky-label">No card selected</div>
      <div class="sticky-btns">
        <button class="btn-save" onclick="saveEntry()">✓ Mark Collected</button>
        <button class="btn-save" onclick="saveWant()" style="background:var(--yellow)">⭐ Add to Want</button>
      </div>
    </div>
  </div>
</div>

<header class="header">
  <div class="logo">Pokédex Binder</div>

function isAlternateArt(card){
  const num=parseInt(card.number);const total=card.set?.total||999;
  if(card.set?.series==='Sword & Shield'&&num>total)return true;
  if(card.number?.startsWith('TG'))return true;
  if(card.number?.startsWith('SH'))return true; // Shiny Vault
  return false;
}
function getDisplayRarity(card){
  if(card.rarity==='Manual')return 'Manual';
  if(isAlternateArt(card))return 'Alternate Art';
  return card.rarity;
}
function getTcgPlayerId(card){const m=(card?.tcgplayer?.url||'').match(/\/(\d+)$/);return m?m[1]:null;}
function tcgPlayerUrl(card){return card?.tcgplayer?.url||`https://www.tcgplayer.com/search/pokemon/product?q=${encodeURIComponent(card?.name||'')}`;}
function ebaySearchUrl(n,s,num){return 'https://www.ebay.com/sch/i.html?_nkw='+encodeURIComponent(n+' '+s+' '+num+' pokemon card')+'&LH_Complete=1&LH_Sold=1&_sacat=0';}

let cardDB={},collection={},wantList={},filterMode='all',viewMode='grid',currentDex=null,selCardId=null,loadedCount=0;
const pptCache={};

// v4 storage: collection[dex] = [{cardId,notes,manualPrice,manualCard}, ...]
// v2 want:    wantList[dex]  = [{cardId,manualPrice,manualCard}, ...]
function migrateEntry(e){return Array.isArray(e)?e:(e?[e]:[]);}
function loadData(){
  // Try new format first
  let rawCol=localStorage.getItem('pokedex_binder_v4');
  let rawWant=localStorage.getItem('pokedex_want_v2');
  // Migrate old single-entry format (v3/v1)
  if(!rawCol){
    try{
      const old=JSON.parse(localStorage.getItem('pokedex_binder_v3')||'{}');
      collection={};
      for(const[k,v]of Object.entries(old)) collection[k]=migrateEntry(v);
      localStorage.setItem('pokedex_binder_v4',JSON.stringify(collection));
    }catch(e){collection={};}
  }else{try{collection=JSON.parse(rawCol);}catch(e){collection={};}}
  if(!rawWant){
    try{
      const old=JSON.parse(localStorage.getItem('pokedex_want_v1')||'{}');
      wantList={};
      for(const[k,v]of Object.entries(old)) wantList[k]=migrateEntry(v);
      localStorage.setItem('pokedex_want_v2',JSON.stringify(wantList));
    }catch(e){wantList={};}
  }else{try{wantList=JSON.parse(rawWant);}catch(e){wantList={};}}
}
function saveCollection(){localStorage.setItem('pokedex_binder_v4',JSON.stringify(collection));updateStats();}
function saveWantList(){localStorage.setItem('pokedex_want_v2',JSON.stringify(wantList));updateStats();}
function dexStr(n){return '#'+String(n).padStart(4,'0');}
function getGen(d){for(let i=0;i<GEN_RANGES.length;i++)if(d>=GEN_RANGES[i][0]&&d<=GEN_RANGES[i][1])return i+1;return 9;}
function rarityBadge(r){
  const m={'Special Illustration Rare':['b-sir','SIR'],'Alternate Art':['b-alt','ALT'],'Hyper Rare':['b-hr','HR'],'Rainbow Rare':['b-rr','RR'],'Secret Rare':['b-sr','SR'],'Full Art':['b-fa','FA'],'Amazing Rare':['b-ar','AR'],'Illustration Rare':['b-ir','IR'],'Manual':['b-manual','M']};
  const[c,l]=m[r]||['b-unk',r||'?'];return `<span class="badge ${c}">${l}</span>`;
}
function bestCard(cards){
  if(!cards?.length)return null;
  return[...cards].sort((a,b)=>{
    const ra=RARITY_PRIORITY[getDisplayRarity(a)]??99,rb=RARITY_PRIORITY[getDisplayRarity(b)]??99;
    if(ra!==rb)return ra-rb;
    return (ERA_ORDER[b.set?.series]??99)-(ERA_ORDER[a.set?.series]??99);
  })[0];
}
function getTcgPrice(card){
  if(!card?.tcgplayer?.prices)return null;
  const p=card.tcgplayer.prices;
  return p.holofoil?.market??p.reverseHolofoil?.market??p.normal?.market??p['1stEditionHolofoil']?.market??null;
}
function fmtPrice(p){return p!=null?'$'+parseFloat(p).toFixed(2):'—';}

function entryPrice(entry,cards){
  if(entry.manualPrice!=null&&!isNaN(+entry.manualPrice))return +entry.manualPrice;
  const card=entry.cardId?cards.find(c=>c.id===entry.cardId):null;
  const eff=card||(entry.cardId?null:bestCard(cards));
  return eff?getTcgPrice(eff):null;
}
function updateStats(){
  let ct=0;
  for(const[d,entries]of Object.entries(collection)){
    const cards=cardDB[+d]||[];
    for(const entry of entries){const p=entryPrice(entry,cards);if(p!=null)ct+=p;}
  }
  document.getElementById('coll-val').textContent='$'+ct.toFixed(2);
  let wt=0,wn=0;
  for(const[d,entries]of Object.entries(wantList)){
    const cards=cardDB[+d]||[];
    for(const entry of entries){wn++;const p=entryPrice(entry,cards);if(p!=null)wt+=p;}
  }
  document.getElementById('want-val').textContent='$'+wt.toFixed(2);
  document.getElementById('want-count').textContent=wn;
  const n=Object.keys(collection).length,t=ALL_POKEMON.length;
  document.getElementById('prog-bar').style.width=(n/t*100).toFixed(1)+'%';
  document.getElementById('prog-n').textContent=n;
  document.getElementById('prog-t').textContent=' / '+t+' collected';
}

function groupByEra(cards){
  const g={};for(const c of cards){const e=c.set?.series||'Other';if(!g[e])g[e]=[];g[e].push(c);}return g;
}

async function fetchPptPrice(tcgId){
  if(!tcgId)return null;
  if(pptCache[tcgId]!==undefined)return pptCache[tcgId];
  try{
    const r=await fetch(PPT_BASE+'?tcgPlayerId='+tcgId,{headers:{'Authorization':'Bearer '+PPT_KEY}});
    if(!r.ok){pptCache[tcgId]=null;return null;}
    const d=await r.json();
    const card=d?.data?.[0];
    const price=card?.prices?.market||card?.prices?.mid||null;
    pptCache[tcgId]=price?+price:null;return pptCache[tcgId];
  }catch(e){pptCache[tcgId]=null;return null;}
}

// ─────────────────────────────────────────────────────────────────
// THE FIX: search by nationalPokedexNumbers instead of card name.
// No more encoding issues with ♀ ♂ apostrophes or spaces.
// Catches every card variant: ex, VMAX, V, GX, etc.
// Cache bumped to v10 — forces a fresh fetch for all 1025 Pokémon.
// ─────────────────────────────────────────────────────────────────
async function fetchPokemon(dex,allRarities=false){
  try{
    let q;
    if(allRarities){
      // Full fetch — all rarities, all sets (triggered on demand per Pokémon)
      q=encodeURIComponent('nationalPokedexNumbers:'+dex);
    }else{
      // Fast fetch — premium/notable rarities only
      const rarQ=TARGET_RARITIES.map(r=>'rarity:"'+r+'"').join(' OR ');
      q=encodeURIComponent('nationalPokedexNumbers:'+dex+' ('+rarQ+')');
    }
    const r=await fetch(API_BASE+'?q='+q+'&select=id,name,set,number,rarity,tcgplayer&orderBy=-set.releaseDate&pageSize=250');
    if(!r.ok){cardDB[dex]=[];return;}
    const d=await r.json();
    const cards=d.data||[];
    cards.sort((a,b)=>(RARITY_PRIORITY[getDisplayRarity(a)]??99)-(RARITY_PRIORITY[getDisplayRarity(b)]??99));
    if(allRarities)cardDB[dex+'_full']=cards; // cache full separately
    else cardDB[dex]=cards;
  }catch(e){cardDB[dex]=[];}
}
// Load all cards for a specific Pokémon on demand (called from modal)
async function loadAllForDex(dex){
  const btn=document.getElementById('load-all-btn-'+dex);
  if(btn){btn.textContent='Loading…';btn.disabled=true;}
  await fetchPokemon(dex,true);
  // Replace cardDB entry with full set
  if(cardDB[dex+'_full']){cardDB[dex]=cardDB[dex+'_full'];}
  openModal(dex); // re-render modal with full card list
}

async function loadAllCards(){
  setStatus('loading','Loading card data…');
  const cached=localStorage.getItem(CACHE_KEY);
  const age=localStorage.getItem(CACHE_AGE_KEY);
  if(cached&&age&&(Date.now()-+age)<86400000){
    try{cardDB=JSON.parse(cached);loadedCount=ALL_POKEMON.length;setStatus('done','Loaded from cache');updateStats();render();return;}catch(e){}
  }
  // Purge all old cache versions
  for(let v=1;v<=11;v++){
    localStorage.removeItem(`pokedex_card_cache_v${v}`);
    localStorage.removeItem(`pokedex_card_cache_age_v${v}`);
  }
  const BATCH=5,DELAY=450;
  const batches=[];
  for(let i=0;i<ALL_POKEMON.length;i+=BATCH)batches.push(ALL_POKEMON.slice(i,i+BATCH));
  for(const batch of batches){
    await Promise.all(batch.map(([dex])=>fetchPokemon(dex)));
    loadedCount=Math.min(loadedCount+batch.length,ALL_POKEMON.length);
    setStatus('loading',`Loading… ${loadedCount}/${ALL_POKEMON.length}`);
    render();
    await new Promise(r=>setTimeout(r,DELAY));
  }
  try{localStorage.setItem(CACHE_KEY,JSON.stringify(cardDB));localStorage.setItem(CACHE_AGE_KEY,String(Date.now()));}catch(e){}
  setStatus('done','All cards loaded ✓');updateStats();render();
}

function setStatus(s,t){document.getElementById('api-txt').textContent=t;document.getElementById('api-dot').className='dot '+s;}

function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const fE=document.getElementById('f-era').value;
  const fR=document.getElementById('f-rar').value;
  const fG=+document.getElementById('f-gen').value||0;
  return ALL_POKEMON.filter(([dex,name])=>{
    if(q&&!name.toLowerCase().includes(q)&&!String(dex).includes(q))return false;
    const isCol=!!(collection[dex]?.length),isWant=!!(wantList[dex]?.length);
    if(filterMode==='col'&&!isCol)return false;
    if(filterMode==='want'&&!isWant)return false;
    if(filterMode==='mis'&&(isCol||isWant))return false;
    if(fG&&getGen(dex)!==fG)return false;
    const cards=cardDB[dex]||[];
    if(fE&&!cards.some(c=>c.set?.series===fE))return false;
    if(fR){
      if(fR==='Alternate Art'){if(!cards.some(c=>isAlternateArt(c)))return false;}
      else{if(!cards.some(c=>c.rarity===fR))return false;}
    }
    return true;
  });
}

function render(){
  updateStats();
  if(filterMode==='want'){renderWantList();return;}
  const items=getFiltered();
  const area=document.getElementById('main');
  if(!items.length){area.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div>No Pokémon match your filters</div></div>';return;}
  viewMode==='grid'?renderGrid(items,area):renderListView(items,area);
}

function renderWantList(){
  const area=document.getElementById('main');
  const wants=Object.entries(wantList);
  if(!wants.length){
    area.innerHTML='<div class="empty"><div class="empty-icon">⭐</div><div style="font-size:0.9rem">Your want list is empty</div><div style="font-size:0.8rem;margin-top:4px">Open any Pokémon and tap "Add to Want List"</div></div>';
    return;
  }
  const sortEl=document.getElementById('want-sort-sel');
  const sortMode=sortEl?sortEl.value:'price-asc';
  // Flatten array: each want entry becomes its own row
  let items=[];
  for(const[dex,entries]of wants){
    const d=+dex,name=ALL_POKEMON.find(p=>p[0]===d)?.[1]||'';
    const cards=cardDB[d]||[];
    for(let idx=0;idx<entries.length;idx++){
      const w=entries[idx];
      const card=(w.cardId?cards.find(c=>c.id===w.cardId):null)||w.manualCard||null;
      const price=w.manualPrice!=null&&!isNaN(+w.manualPrice)?+w.manualPrice:(card?getTcgPrice(card):null);
      items.push({dex:d,name,card,price,w,idx});
    }
  }
  if(sortMode==='price-asc')items.sort((a,b)=>(a.price??9999)-(b.price??9999));
  else if(sortMode==='price-desc')items.sort((a,b)=>(b.price??-1)-(a.price??-1));

  else items.sort((a,b)=>a.name.localeCompare(b.name));
  let known=0,unk=0;items.forEach(i=>i.price!=null?known+=i.price:unk++);
  let html=`<div class="want-header">
    <div><div class="want-title">⭐ Want List — ${items.length} cards</div>

  for(const{dex,name,card,price}of items){

    const tcgUrl=card?tcgPlayerUrl(card):`https://www.tcgplayer.com/search/pokemon/product?q=${encodeURIComponent(name)}`;

function renderGrid(items,area){
  let html='<div class="grid">',lastGen=-1;
  for(const[dex,name]of items){
    const gen=getGen(dex);
    if(gen!==lastGen){html+=`<div class="gen-hdr">${GEN_NAMES[gen-1]}</div>`;lastGen=gen;}
    const cards=cardDB[dex];
    const colEntries=collection[dex]||[];
    const wantEntries=wantList[dex]||[];
    const isCol=colEntries.length>0,isWant=wantEntries.length>0;
    // Gather all API cards plus any manual cards from collection entries
    const allCards=[...(cards||[])];
    colEntries.forEach(e=>{if(e.manualCard)allCards.unshift(e.manualCard);});
    const best=allCards.length?bestCard(allCards):null;
    // Show total value of all owned entries for this Pokémon
    const dbCards=cards||[];
    const totalColVal=colEntries.reduce((sum,e)=>{const p=entryPrice(e,dbCards);return sum+(p||0);},0);
    const price=colEntries.length?totalColVal:null;
    const isLoad=cards===undefined;
    let sb='';
    if(isCol){
      const cnt=colEntries.length;
      sb='<div class="status-badge collected" style="'+(cnt>1?'width:auto;border-radius:8px;padding:0 4px;font-size:8px;font-weight:600;':'')+'">'+( cnt>1?'<span style="color:#fff">'+cnt+'×</span>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>')+'</div>';
    }else if(isWant){
      const cnt=wantEntries.length;
      sb='<div class="status-badge wanted" style="'+(cnt>1?'width:auto;border-radius:8px;padding:0 4px;font-size:8px;font-weight:600;':'')+'"><span>'+(cnt>1?'⭐×'+cnt:'⭐')+'</span></div>';
    }
    // In collected mode show actual owned card(s), in want mode show wanted card(s)
    let displayCard=null;
    let displayLabel='';
    if(isCol&&colEntries.length>0){
      const e=colEntries[0];
      displayCard=e.cardId?(dbCards.find(c=>c.id===e.cardId)||e.manualCard):e.manualCard;
      displayLabel=colEntries.length>1?' + '+(colEntries.length-1)+' more':'';
    }else if(isWant&&wantEntries.length>0){
      const e=wantEntries[0];
      displayCard=e.cardId?(dbCards.find(c=>c.id===e.cardId)||e.manualCard):e.manualCard;
      displayLabel=wantEntries.length>1?' + '+(wantEntries.length-1)+' more':'';
    }else{
      displayCard=best;
    }
    const showCard=displayCard||best;
    let inner=isLoad?'<div class="card-count"><span class="spinner"></span></div>':
      !allCards.length&&!isCol&&!isWant?'<div class="no-cards">No cards found — tap to add</div>':
      '<div class="card-count">'+(isCol?'<span style="color:var(--green)">Owned</span>':isWant?'<span style="color:var(--yellow)">Wanted</span>':'<span>'+allCards.length+'</span> card'+(allCards.length!==1?'s':''))+'</div>'+(showCard?rarityBadge(getDisplayRarity(showCard)):'')+'<div class="card-best" style="margin-top:4px">'+(showCard?showCard.name:'')+'</div><div class="card-best" style="color:var(--text3)">'+(showCard?(showCard.set?.name||'Manual')+' · #'+(showCard.number||'—'):'')+(displayLabel?'<span style="color:var(--text3)"> '+displayLabel+'</span>':'')+'</div><div class="card-price">TCG: <span>'+(price!=null?fmtPrice(price):'—')+'</span></div>';
    const cls=isCol?'collected':isWant?'wanted':'';
    html+=`<div class="poke-card${cls?' '+cls:''}" onclick="openModal(${dex})">${sb}<div class="card-dex">${dexStr(dex)}</div><div class="card-name">${name}</div>${inner}</div>`;
  }
  html+='</div>';area.innerHTML=html;
}

function renderModalCards(cards, selectedId, filter=''){
  const q=filter.toLowerCase().trim();
  let html='';
  const eras=['Scarlet & Violet','Sword & Shield','Sun & Moon','XY','Black & White','HeartGold & SoulSilver','Platinum','Diamond & Pearl','EX','Neo','Gym','Base','Other'];
  const groups=groupByEra(cards);
  let totalShown=0;
  for(const era of eras){
    if(!groups[era]?.length)continue;
    const eraCards=groups[era]
      .sort((a,b)=>(RARITY_PRIORITY[getDisplayRarity(a)]??99)-(RARITY_PRIORITY[getDisplayRarity(b)]??99))
      .filter(c=>{
        if(!q)return true;
        return(
          c.name.toLowerCase().includes(q)||
          c.set?.name?.toLowerCase().includes(q)||
          c.number?.toLowerCase().includes(q)||
          getDisplayRarity(c).toLowerCase().includes(q)
        );
      });
    if(!eraCards.length)continue;
    totalShown+=eraCards.length;
    html+=`<div class="era-group"><div class="era-title">${era} (${eraCards.length})</div>`;
    for(const card of eraCards){
      const sel=card.id===selectedId;
      html+=`<div class="card-opt${sel?' sel':''}" onclick="selCard('${card.id}')">
        <div class="opt-name">${card.name}</div>
        <div class="opt-meta">${rarityBadge(getDisplayRarity(card))}<span>${card.set.name}</span><span>#${card.number}</span></div>
        <div class="price-row">
          <div class="price-source"><div class="price-source-label">TCGPlayer</div><div class="price-source-val">${fmtPrice(getTcgPrice(card))}</div></div>
          <div class="price-source" id="ppt-${card.id}"><div class="price-source-label">PriceTracker</div><div class="price-source-val loading"><span class="spinner-sm"></span></div></div>
          <div class="price-source" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px"><div class="price-source-label">eBay Sold</div><a class="ebay-btn" href="${ebaySearchUrl(card.name,card.set.name,card.number)}" target="_blank" onclick="event.stopPropagation()">View ↗</a></div>
        </div>
        <div style="margin-top:6px"><a class="buy-btn" href="${tcgPlayerUrl(card)}" target="_blank" onclick="event.stopPropagation()"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Buy on TCGPlayer</a></div>
      </div>`;
    }
    html+='</div>';
  }
  if(q&&totalShown===0)html=`<div class="no-results">No cards match "${filter}"</div>`;
  return html;
}
function filterModalCards(val){
  const cards=cardDB[currentDex]||[];
  // In col/want mode the search writes to m-card-list-all, otherwise m-card-list
  const listId=(filterMode==='col'||filterMode==='want')?'m-card-list-all':'m-card-list';
  const list=document.getElementById(listId);
  if(list)list.innerHTML=val.trim()?renderModalCards(cards,selCardId,val):'';
  // Re-attach PriceTracker fetches for newly visible cards
  cards.forEach(card=>{
    const el=document.getElementById('ppt-'+card.id);
    if(el&&el.querySelector('.loading')){
      const tcgId=getTcgPlayerId(card);
      fetchPptPrice(tcgId).then(price=>{
        const e2=document.getElementById('ppt-'+card.id);
        if(e2){e2.querySelector('.price-source-val').className='price-source-val'+(price?'':' na');e2.querySelector('.price-source-val').textContent=fmtPrice(price);}
      });
    }
  });
}
function updateStickyLabel(){
  const lbl=document.getElementById('sticky-label');
  if(!lbl)return;
  if(!selCardId){lbl.textContent='No card selected';return;}
  const cards=cardDB[currentDex]||[];
  const card=cards.find(c=>c.id===selCardId);
  if(card){
    lbl.innerHTML=`<strong>${card.name}</strong> · ${card.set?.name||''} #${card.number||''} · ${fmtPrice(getTcgPrice(card))}`;
  }else{
    lbl.textContent='Manual card selected';
  }
}
function getManualEntry(){
  const notes=document.getElementById('m-notes')?.value.trim()||'';
  const ps=document.getElementById('m-price')?.value.trim();
  const manualPrice=ps&&!isNaN(+ps)?+ps:null;
  const mcName=document.getElementById('m-card-name')?.value.trim();
  const mcSet=document.getElementById('m-set-name')?.value.trim();
  const mcNum=document.getElementById('m-card-num')?.value.trim();
  const mcRar=document.getElementById('m-card-rar')?.value;
  const mcEra=document.getElementById('m-card-era')?.value;
  const manualCard=(mcName||mcSet)?{id:'manual-'+currentDex+'-'+Date.now(),name:mcName||'Manual Entry',number:mcNum||'—',rarity:mcRar||'Manual',set:{name:mcSet||'Unknown Set',series:mcEra||'Scarlet & Violet'}}:null;
  return{cardId:selCardId,notes,manualPrice,manualCard};
}
function toggleWant(){saveWant();}
function saveWant(){
  if(!currentDex)return;
  const entry=getManualEntry();
  if(!wantList[currentDex])wantList[currentDex]=[];
  wantList[currentDex].push({cardId:entry.cardId,manualPrice:entry.manualPrice,manualCard:entry.manualCard});
  saveWantList();
  openModal(currentDex);render();
}
function removeWant(dex,idx){
  if(!wantList[dex])return;
  wantList[dex].splice(idx,1);
  if(wantList[dex].length===0)delete wantList[dex];
  saveWantList();renderWantList();
}
function removeWantEntry(idx){
  if(!currentDex||!wantList[currentDex])return;
  wantList[currentDex].splice(idx,1);
  if(wantList[currentDex].length===0)delete wantList[currentDex];
  saveWantList();openModal(currentDex);render();
}
function selCard(id){
  selCardId=id;
  document.querySelectorAll('.card-opt').forEach(el=>el.classList.toggle('sel',(el.getAttribute('onclick')||'').includes(`'${id}'`)));
  updateStickyLabel();
}
function closeModal(){document.getElementById('backdrop').classList.remove('open');currentDex=null;selCardId=null;}
function saveEntry(){
  if(!currentDex)return;
  const entry=getManualEntry();
  if(!collection[currentDex])collection[currentDex]=[];
  collection[currentDex].push(entry);
  // Remove first want entry if any (they got the card)
  if(wantList[currentDex]?.length){wantList[currentDex].shift();if(!wantList[currentDex].length)delete wantList[currentDex];saveWantList();}
  saveCollection();openModal(currentDex);render();
}
function removeEntry(idx){
  if(!currentDex)return;
  if(collection[currentDex]){
    collection[currentDex].splice(idx,1);
    if(collection[currentDex].length===0)delete collection[currentDex];
  }
  saveCollection();openModal(currentDex);render();
}
function setF(mode,btn){
  filterMode=mode;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('on','on-green','on-blue','on-yellow'));
  btn.classList.add(mode==='all'?'on':mode==='col'?'on-green':mode==='want'?'on-yellow':'on-blue');
  render();
}
function setView(v){
  viewMode=v;
  document.getElementById('vb-g').classList.toggle('active',v==='grid');
  document.getElementById('vb-l').classList.toggle('active',v==='list');
  render();
}
document.getElementById('backdrop').addEventListener('click',e=>{if(e.target===document.getElementById('backdrop'))closeModal();});
loadData();render();loadAllCards();
</script>

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW failed:', err));
  });
}
</script>
